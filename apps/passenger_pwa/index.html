<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8B7355">
<title>LiveryOS — My Ride</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --ink:#333; --muted:#666; --line:#ddd; --accent:#8B7355; --bg:#faf8f5; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 20px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  main { max-width:560px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  label { font-size:13px; color:var(--muted); display:block; margin-bottom:4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px 18px; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .status { font-size:22px; letter-spacing:.04em; margin:4px 0 12px; }
  .row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px dashed var(--line); }
  .row:last-child { border-bottom:0; }
  .muted { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:999px; padding:2px 10px; color:var(--muted); }
  #live { font-size:13px; }
  #live.on { color:#4a7a52; } #live.off { color:#a0653a; }
  .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .err { color:#9a3d3d; font-size:14px; margin-top:8px; }
</style>
</head>
<body>
<header><h1>LiveryOS — My Ride</h1></header>
<main>
  <div class="card" id="lookup">
    <label for="ref">Booking reference</label>
    <input id="ref" placeholder="e.g. RES-9001" autocomplete="off">
    <div class="actions">
      <button id="go">Track my ride</button>
    </div>
    <div class="err" id="err"></div>
  </div>

  <div class="card" id="ride" hidden>
    <span class="pill" id="svc"></span>
    <div class="status" id="status"></div>
    <div id="live" class="off">● offline — showing last known state</div>
    <div class="row"><span>Pickup</span><span id="pickup"></span></div>
    <div class="row"><span>Dropoff</span><span id="dropoff"></span></div>
    <div class="row"><span>Pickup time</span><span id="when"></span></div>
    <div class="row"><span>Driver</span><span id="driver">—</span></div>
    <div class="row"><span>Vehicle</span><span id="vehicle">—</span></div>
    <div class="row"><span>Fare</span><span id="fare">—</span></div>
    <div class="row"><span>Driver ETA</span><span id="eta">—</span></div>
    <div class="muted" id="updated"></div>
    <div class="actions">
      <button class="ghost" id="wa">Share via WhatsApp</button>
      <button class="ghost" id="refresh">Refresh</button>
    </div>
  </div>
</main>
<script src="https://unpkg.com/centrifuge@5.2.0/dist/centrifuge.js"></script>
<script src="app.js"></script>
</body>
</html>
