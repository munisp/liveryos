# Production overlay — applied on top of docker-compose.yml:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
# Adds the Caddy TLS proxy and removes dev-only port exposure.
# Internal services talk over the compose network; only Caddy faces the internet.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - bench
      - keycloak
      - centrifugo
      - metabase
      - livekit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  keycloak:
    # production mode instead of start-dev
    command: ["start"]
    ports: []        # reachable only via Caddy (auth.example.com)

  traccar:
    ports: []        # device ports stay closed until real GPS devices exist;
                     # driver PWA reports over HTTPS through the bench

  livery-db:
    ports: []        # no public Postgres — the dev port mapping was convenience

  livekit:
    ports:
      - "7881:7881"        # RTC TCP — must stay reachable for media
      - "7882:7882/udp"    # RTC UDP mux — must stay reachable for media
    # signalling (7880) and SIP (5060) stay internal: wss comes via Caddy
    # (rtc.example.com), SIP bridging is carrier-side.

volumes:
  caddy-data:
  caddy-config:
