version: "3.8"

# LiveryOS production-grade local/stack topology (report Ch. 5 §5.2.1)
# System of record: Frappe bench (ERPNext + livery_core app).
# Satellites: Valhalla (routing), Nominatim (geocoding), Traccar (GPS ingest),
# Centrifugo (realtime), Keycloak (SSO), Metabase (BI on read replica).
# All stack-critical components are permissively licensed (report Ch. 4).
# Metabase is AGPL — runs as an isolated satellite on its own DB connection,
# never modified, never linked (boundary-service rule, report Ch. 4 §4.2.6).
# Nominatim is GPLv2/GPLv3+ — boundary service only, accessed over HTTP.

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme}
    volumes:
      - mariadb-data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  bench:
    image: frappe/erpnext:v15
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis:6379/0
      REDIS_QUEUE: redis://redis:6379/1
      REDIS_SOCKETIO: redis://redis:6379/2
      # Internal service URLs — the bench never calls public internet for these
      LIVERY_VALHALLA_URL: http://valhalla:8002
      LIVERY_NOMINATIM_URL: http://nominatim:8080
      LIVERY_TRACCAR_URL: http://traccar:8082
      LIVERY_CENTRIFUGO_URL: http://centrifugo:8000
      LIVERY_KEYCLOAK_URL: http://keycloak:8080
    volumes:
      - bench-sites:/home/frappe/frappe-bench/sites
      - ../apps/livery_core:/home/frappe/frappe-bench/apps/livery_core
    # NOTE: Frappe Cloud shared tiers ($5–$50) cannot host custom apps —
    # a private bench (this topology) is mandatory (report Ch. 2 §2.3.2).

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    # MIT. Routing engine. Load OSM extract per market: portugal-latest + nigeria-latest
    # (geofabrik). Nigeria tile quality caveat: run Lagos ground-truth sprint first
    # (report Ch. 4 §4.2.1). GraphHopper is the low-spec fallback for constrained nodes.
    volumes:
      - valhalla-tiles:/custom_files

  nominatim:
    image: mediagis/nominatim:4.5
    # GPLv2/GPLv3+ — BOUNDARY SERVICE: HTTP only, never embedded or modified.
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main
    environment:
      PBF_URL: ${NOMINATIM_PBF_URL:-https://download.geofabrik.de/europe/portugal-latest.osm.pbf}
      REPLICATION_URL: ${NOMINATIM_REPLICATION_URL:-https://download.geofabrik.de/europe/portugal-updates/}

  traccar:
    image: traccar/traccar:latest
    # Apache-2.0. 200+ GPS protocols; REST/WebSocket/MQTT/webhooks.
    # Canonical flow: Traccar → webhook → position store → Centrifugo → boards/apps
    # (report Ch. 4 §4.2.3, Ch. 5 flow 2).
    ports:
      - "8082:8082"
      - "5000-5150:5000-5150/tcp"   # device protocol ports — restrict in production
      - "5000-5150:5000-5150/udp"
    volumes:
      - traccar-data:/opt/traccar/conf

  centrifugo:
    image: centrifugo/centrifugo:v5
    # MIT. Realtime fan-out for dispatch boards + passenger tracking.
    # Token-issuing backend lives in livery_core (channel auth per tenant).
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    volumes:
      - ./centrifugo.json:/centrifugo/config.json:ro

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # Apache-2.0. One realm per tenant (report Ch. 5 §5.3.2).
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-changeme}
    ports:
      - "8080:8080"

  metabase:
    image: metabase/metabase:latest
    # AGPL-3.0 — BOUNDARY SERVICE: connects to a MariaDB READ REPLICA with a
    # read-only user; unmodified binary; never bundled into product code.
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
    depends_on:
      - metabase-db

  metabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${MB_DB_PASSWORD:-changeme}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data

volumes:
  mariadb-data:
  redis-data:
  bench-sites:
  valhalla-tiles:
  nominatim-data:
  traccar-data:
  metabase-db-data:
