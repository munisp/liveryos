# LiveKit server config (telephony & messaging workstream).
# Keys come from env (LIVEKIT_KEYS) — this file carries behavior, not secrets.
port: 7880
bind_addresses: ["0.0.0.0"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
room:
  empty_timeout: 300          # drop rooms 5 min after the last participant
  departure_timeout: 60
logging:
  level: info
# SIP bridging (masked passenger↔driver calls to real PSTN numbers) is
# configured per-deployment via `livekit-cli sip trunk create` against the
# carrier; the domain layer (telephony.masking) owns number lifecycle and
# refuses to bridge expired/released proxies.
# turn:
#   enabled: true             # enable behind restrictive NATs (NG mobile)
