name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml   # pyyaml: pubspec parse in test_native_mobile
      - run: python -m pytest tests/ -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v4.2.2
      - run: docker compose -f infra/docker-compose.yml config -q
      - run: python3 -c "import json;json.load(open('infra/centrifugo.json'))"
      - run: python3 -c "import json;json.load(open('apps/livery_core/livery_core/dispatch/doctype/livery_ride/livery_ride.json'))"
      - run: bash -n scripts/new-tenant.sh
      - run: bash -n scripts/deploy-vps.sh && bash -n scripts/backup.sh
      - run: pip install -q pyyaml && python3 -c "import yaml;yaml.safe_load(open('infra/docker-compose.prod.yml'));yaml.safe_load(open('infra/livekit.yaml'))"
      - run: python3 -m py_compile scripts/provision-metabase.py
      - run: python3 -m py_compile services/longcat_tts_server.py
      - run: python3 -c "import json,glob;[json.load(open(f)) for f in glob.glob('bi/dashboards/*.json')];print('dashboard manifests OK')"
      - run: python3 -c "import psycopg2" 2>/dev/null || echo "NO_PSQL — SQL validated by test_bi.py structural checks"

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v4.2.2
      - run: node --check apps/passenger_pwa/app.js && node --check apps/passenger_pwa/sw.js
      - run: node --check apps/driver_pwa/app.js && node --check apps/driver_pwa/sw.js
      - run: node --check apps/booking_widget/widget.js && node --check apps/corporate_portal/app.js
      - run: python3 -c "import json;json.load(open('apps/passenger_pwa/manifest.webmanifest'));json.load(open('apps/driver_pwa/manifest.webmanifest'));json.load(open('apps/corporate_portal/manifest.webmanifest'))"
